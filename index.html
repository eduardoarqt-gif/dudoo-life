<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="styles.css?v=0.6.27">
<script>
/* Sem zoom por duplo toque (17/10/2026): o iOS ignora user-scalable, então segura o 2º toque em áreas que não são botão/campo. */
(function () {
  var ultimo = 0;
  document.addEventListener("touchend", function (e) {
    var t = Date.now();
    if (t - ultimo < 350 && !(e.target.closest && e.target.closest("button,a,input,textarea,select,label,summary,[data-acao],[role=button]"))) e.preventDefault();
    ultimo = t;
  }, { passive: false });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
})();
</script>
</head>
<body>
<div id="fundo" class="fundo"></div>
<div id="app">
  <header class="topo">
    <div class="marca">Dudoo<i>Life</i></div>
    <div id="estadoSync" class="sync" title="Estado dos dados">Local</div>
  </header>

  <main id="tela"></main>

  <nav class="abas">
    <button data-tela="dia" class="on"><span>⌂</span>Meu dia</button>
    <button data-tela="vida"><span>◷</span>Minha vida</button>
    <button data-tela="assistente"><span>✦</span>Assistente</button>
    <button data-tela="mais"><span>⋯</span>Mais</button>
  </nav>

  <div id="folha" class="folha" hidden></div>
</div>
